name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: pip install -e ".[dev,cli]"

      - name: Ruff check
        run: ruff check password_generator tests cli.py

      - name: Ruff format check
        run: ruff format --check password_generator tests cli.py

      - name: Pyright
        run: pyright password_generator

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev,cli]"

      - name: Run tests with coverage
        run: pytest -q

      - name: Smoke CLI
        run: |
          password-gen --length 16 --count 1 --json
          echo -n "password" | password-gen --analyze --json
